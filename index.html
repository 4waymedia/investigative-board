<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Investigative Board</title>
    <link rel="stylesheet" href="css/board-styles.css" />

    <!-- Core dependencies -->
    <script src="js/utilities.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/core/constants.js"></script>
    <script src="js/core/utils.js"></script>

    <!-- Domain modules -->
    <script src="js/domain/nodeTypes.js"></script>
    <script src="js/domain/connections.js"></script>
    <script src="js/domain/cards.js"></script>

    <!-- Core application modules -->
    <script src="js/core/state.js"></script>
    <script src="js/events/eventHandlers.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/ui/modal.js"></script>
    <script src="js/ui/tray.js"></script>
    <script src="js/ui/toolbar.js"></script>

    <!-- Rendering modules (load before app.js) -->
    <script src="js/drawing.js"></script>
    <script src="js/text.js"></script>

    <script src="js/core/app.js"></script>
  </head>
  <body>
    <!-- Top menu -->
    <div id="menu">
      <div id="toolset"></div>
    </div>

    <!-- Main canvas container -->
    <div id="canvas-container">
      <canvas id="board"></canvas>
    </div>

    <!-- Pin info panel -->
    <div id="pin-info">
      <div id="pin-info-header">
        <div>
          <div id="pin-info-title"></div>
          <div id="pin-info-sub"></div>
        </div>
        <div class="pin-color-pill" id="pin-info-color"></div>
      </div>
      <div id="pin-info-note"></div>
      <div class="pin-info-meta" id="pin-info-meta"></div>
    </div>

    <!-- Bottom tray -->
    <div id="tray">
      <div id="tray-header">
        <div id="tray-title">Cards</div>
        <div id="tray-toggle">▼</div>
      </div>
      <div id="tray-content"></div>
    </div>

    <!-- Modals -->
    <div id="pin-modal-backdrop">
      <div id="pin-modal">
        <div id="pin-modal-header">
          <div id="pin-modal-title">Edit Pin</div>
          <div id="pin-modal-close">✕</div>
        </div>

        <!-- Tab Navigation -->
        <div id="modal-tabs">
          <div class="tab-button active" data-tab="info">Info</div>
          <div class="tab-button" data-tab="style">Style</div>
          <div class="tab-button" data-tab="settings">Settings</div>
        </div>

        <!-- Tab Content -->
        <div id="modal-content">
          <!-- Info Tab -->
          <div class="tab-content active" id="info-tab">
            <div class="form-group">
              <label for="pm-title">Title</label>
              <input type="text" id="pm-title" placeholder="Pin title">
            </div>
            <div class="form-group">
              <label for="pm-description">Description</label>
              <textarea id="pm-description" placeholder="Pin description"></textarea>
            </div>
            <div class="form-group">
              <label for="pm-note">Note</label>
              <textarea id="pm-note" placeholder="Additional notes"></textarea>
            </div>
            <div class="form-group">
              <label for="pm-date">Date</label>
              <input type="date" id="pm-date">
            </div>
          </div>

          <!-- Style Tab -->
          <div class="tab-content" id="style-tab">
            <div class="form-group">
              <label for="pm-color">Color</label>
              <input type="color" id="pm-color">
            </div>
            <div class="form-group">
              <label for="pm-text-color">Text Color</label>
              <input type="color" id="pm-text-color">
            </div>
          </div>

          <!-- Settings Tab -->
          <div class="tab-content" id="settings-tab">
            <div class="form-group">
              <label for="pm-pin-selector">Pin Type</label>
              <select id="pm-pin-selector">
                <option value="circle">Circle</option>
                <option value="square">Square</option>
                <option value="pill">Pill</option>
                <option value="diamond">Diamond</option>
                <option value="person">Person</option>
                <option value="business-building">Building</option>
              </select>
            </div>
            <div class="form-group">
              <label for="pm-scale">Scale</label>
              <input type="range" id="pm-scale" min="0.1" max="3" step="0.1">
            </div>
          </div>
        </div>

        <!-- Modal Actions -->
        <div id="modal-actions">
          <button id="pm-delete">Delete</button>
          <button id="pm-save">Save</button>
        </div>
      </div>
    </div>

    <!-- Color Picker Modal -->
    <div id="add-color-modal-backdrop">
      <div id="add-color-modal">
        <div id="add-color-modal-header">
          <div id="add-color-modal-title">Add Custom Color</div>
          <div id="add-color-modal-close">✕</div>
        </div>
        <div id="add-color-modal-content">
          <input type="color" id="new-color-picker">
          <button id="add-color-btn">Add Color</button>
        </div>
      </div>
    </div>

    <!-- Card Modal -->
    <div id="card-modal-backdrop">
      <div id="card-modal">
        <div id="card-modal-header">
          <div id="card-modal-title">Edit Card</div>
          <div id="card-modal-close">✕</div>
        </div>
        <div id="card-modal-content">
          <div class="form-group">
            <label for="cm-title">Title</label>
            <input type="text" id="cm-title" placeholder="Card title">
          </div>
          <div class="form-group">
            <label for="cm-content">Content</label>
            <textarea id="cm-content" placeholder="Card content"></textarea>
          </div>
          <div class="form-group">
            <label for="cm-color">Color</label>
            <input type="color" id="cm-color">
          </div>
        </div>
        <div id="card-modal-actions">
          <button id="cm-delete">Delete</button>
          <button id="cm-save">Save</button>
        </div>
      </div>
    </div>

    <!-- Load Modal -->
    <div id="load-modal-backdrop">
      <div id="load-modal">
        <div id="load-modal-header">
          <div id="load-modal-title">Load Board</div>
          <div id="load-modal-close">✕</div>
        </div>
        <div id="load-modal-content">
          <div id="load-options">
            <button id="load-from-file">Load from File</button>
            <button id="load-example">Load Example</button>
          </div>
          <input type="file" id="file-input" accept=".json" style="display: none;">
        </div>
      </div>
    </div>

    <!-- Text Modal -->
    <div id="text-modal-backdrop">
      <div id="text-modal">
        <div id="text-modal-header">
          <div id="text-modal-title">Edit Text</div>
          <div id="text-modal-close">✕</div>
        </div>
        <div id="text-modal-content">
          <textarea id="text-modal-input" placeholder="Enter text..."></textarea>
          <div id="text-modal-options">
            <div class="form-group">
              <label for="text-modal-type">Type</label>
              <select id="text-modal-type">
                <option value="rectangle">Rectangle</option>
                <option value="bubble">Bubble</option>
              </select>
            </div>
            <div class="form-group">
              <label for="text-modal-color">Bubble Color</label>
              <input type="color" id="text-modal-color">
            </div>
            <div class="form-group">
              <label for="text-modal-text-color">Text Color</label>
              <input type="color" id="text-modal-text-color">
            </div>
          </div>
        </div>
        <div id="text-modal-actions">
          <button id="text-modal-delete">Delete</button>
          <button id="text-modal-save">Save</button>
        </div>
      </div>
    </div>

    <!-- Application initialization -->
    <script>
      // Initialize the application when DOM is ready
      document.addEventListener('DOMContentLoaded', () => {
        console.log("DOM loaded, checking for Application class...");
        console.log("window.Application:", window.Application);
        if (window.Application) {
          // Debug: Check if rendering modules loaded
          console.log("🔍 Pre-init check:");
          console.log("🔍 window.drawPinShape:", typeof window.drawPinShape);
          console.log("🔍 window.shapeRenderers:", !!window.shapeRenderers);

          window.app = new window.Application();
          window.app.initialize().catch(console.error);

          // Initialize UI handlers after app is ready
          if (typeof setupUIHandlers === 'function') {
            setupUIHandlers();
          }
        } else {
          console.error("Application class not found");
        }
      });
    </script>

    <!-- Right side controls -->
    <div id="controls">
      <div class="ctrl-btn" id="reset" title="Reset board">↻</div>
      <div class="ctrl-btn magic" id="magic" title="Toggle Force Layout">★</div>
      <div class="ctrl-btn radial" id="radial" title="Radial Mind Map">🌸</div>
      <div class="ctrl-btn clusters" id="clusters" title="Affinity Clusters">
        ☁️
      </div>
      <div class="ctrl-btn timeline" id="timeline" title="Auto Timeline">
        ⏳
      </div>
    </div>
  </body>
</html>
