<!DOCTYPE html>
<html>
  <head>
    <title>HTML Canvas Person Icon</title>
    <style>
      /* Optional: Just for better viewing in a browser */
      canvas {
        border: 1px solid #ccc;
        background-color: #f9f9f9;
      }
    </style>
  </head>
  <body>
    <canvas id="personCanvas" width="100" height="120"></canvas>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const canvas = document.getElementById("personCanvas");
        const ctx = canvas.getContext("2d");

        // Define coordinates and sizes
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const headRadius = 25;
        const bodyWidth = 70;
        const bodyHeight = 35;
        const bodyY = centerY + headRadius - 20; // Start the body below the head
        const fillColor = "#aaa"; // Dark gray color for the icon
        const fillColorLight = "#333";

        // --- 2. Draw the Body (a Rounded Rectangle / Arch) ---
        ctx.beginPath();
        ctx.fillStyle = fillColorLight;
        // Start at the bottom left of the body
        ctx.moveTo(centerX - bodyWidth / 2, bodyY + bodyHeight);

        // Draw the top arc (the shoulders)
        // quadraticCurveTo(controlX, controlY, endX, endY)
        // This creates a smooth, rounded top
        ctx.quadraticCurveTo(
          centerX - bodyWidth / 2, // Control Point X
          bodyY, // Control Point Y
          centerX, // End Point X
          bodyY // End Point Y
        );

        // Draw from the center to the top right side
        ctx.quadraticCurveTo(
          centerX + bodyWidth / 2, // Control Point X
          bodyY, // Control Point Y
          centerX + bodyWidth / 2, // End Point X
          bodyY + bodyHeight // End Point Y
        );

        // Close the shape (draws the bottom line)
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = fillColor;

        // --- 1. Draw the Head (a Circle) ---
        ctx.beginPath();
        // arc(x, y, radius, startAngle, endAngle)
        ctx.arc(centerX, centerY - 10, headRadius, 0, Math.PI * 2, true);
        ctx.fill();
        ctx.closePath();
      });
    </script>
  </body>
</html>
